<!doctype html>
<html lang="en">

<head>

  <link rel="icon" type="image/svg+xml" href="/ventureroom-mark.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#10251F" />
  <meta name="description" content="VentureRoom helps founders rehearse high-stakes investor conversations with an AI panel, pitch-deck feedback and practical readiness reports." />

  <!-- Facebook (Meta Business) domain verification. Must stay in this static
       <head>: the check fails if the tag is added by JavaScript. -->
  <meta name="facebook-domain-verification" content="s6d893711ptx5vqk7lhx003br7eu4x" />

  <!-- ── Social sharing preview (Open Graph + Twitter Card) ──
       NOTE: og:image / og:url MUST be absolute URLs (crawlers don't run JS).
       Update the domain below if the production domain changes. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VentureRoom" />
  <meta property="og:title" content="VentureRoom — Founder Pitch Preparation" />
  <meta property="og:description" content="Prepare for your next investor conversation with realistic AI pitch practice, deck-aware questions and clear feedback." />
  <meta property="og:url" content="https://www.pitchnest.app/" />
  <meta property="og:image" content="https://www.pitchnest.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="VentureRoom — make your next big room feel familiar" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="VentureRoom — Founder Pitch Preparation" />
  <meta name="twitter:description" content="Prepare for your next investor conversation with realistic AI pitch practice, deck-aware questions and clear feedback." />
  <meta name="twitter:image" content="https://www.pitchnest.app/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Apple/iOS Web App Support -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VentureRoom" />
  <!-- iOS fills transparent areas of an apple-touch-icon with BLACK, so this
       must be a full-bleed (no-transparency) square — using the maskable asset. -->
  <link rel="apple-touch-icon" href="/ventureroom-mark.svg" />

  <title>VentureRoom — AI Investor Pitch Practice</title>
</head>
